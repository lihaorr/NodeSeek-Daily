name: NodeSeek 签到与抽奖新帖

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview 只筛选；live 实际签到和评论
        type: choice
        options: [preview, live]
        default: preview
  pull_request:
  push:
    branches: ['feat/**']
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Offline preview (no account actions)
        run: python nodeseek_daily.py --feed-file tests/fixtures/giveaways.xml --at 2026-11-25T08:00:00+00:00
      - name: Set up Chrome for loopback-only browser tests
        id: chrome-test
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
          install-chromedriver: true
      - name: Verify real browser adapter against local fixtures
        env:
          NS_BROWSER_SMOKE: 'true'
          CHROME_PATH: ${{ steps.chrome-test.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome-test.outputs.chromedriver-path }}
        run: python -m unittest discover -s tests -p test_browser_smoke.py -v

  automation:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    concurrency:
      group: nodeseek-account-automation
      cancel-in-progress: false
    env:
      LIVE_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'live') || (github.event_name == 'schedule' && vars.NS_LIVE == 'true') }}
      DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Require default branch for live execution
        if: env.LIVE_REQUESTED == 'true'
        run: |
          if [ "$GITHUB_REF" != "$DEFAULT_REF" ]; then
            echo 'Live execution is only allowed from the default branch.'
            exit 1
          fi
      - name: Set up Chrome
        if: env.LIVE_REQUESTED == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: python -m pip install -r requirements.txt
      - name: Preview or execute with synchronous state checkpoints
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          NS_USER_ID: ${{ vars.NS_USER_ID }}
          NS_RANDOM: ${{ secrets.NS_RANDOM }}
          NS_COMMENT_TEXTS: ${{ vars.NS_COMMENT_TEXTS }}
          NS_STATE_BACKEND: github
          NS_STATE_BRANCH: automation-state
          GH_TOKEN: ${{ github.token }}
          HEADLESS: 'true'
        run: |
          if [ "$LIVE_REQUESTED" = 'true' ]; then
            python nodeseek_daily.py --live
          else
            python nodeseek_daily.py
          fi
